name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Add the Screen Time extensions to the Xcode project
        run: |
          sudo gem install xcodeproj --no-document
          cd ios && ruby scripts/add_screen_time_targets.rb

      - run: flutter analyze --no-fatal-infos
      # No code signing yet. This checks that the iOS app compiles.
      - run: flutter build ios --release --no-codesign
