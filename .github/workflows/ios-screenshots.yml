name: iOS simulator screenshots

# Builds a special "screenshot mode" app, boots an iPhone simulator,
# opens each screen with sample data and saves a picture of it.
# Run it by hand: GitHub > Actions > "iOS simulator screenshots" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Simulator to use (part of its name)"
        default: "iPhone 16 Pro Max"

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Add the Screen Time extensions to the Xcode project
        run: |
          sudo gem install xcodeproj --no-document
          cd ios && ruby scripts/add_screen_time_targets.rb

      - name: Build the app for the simulator (screenshot mode)
        run: flutter build ios --simulator --debug --dart-define=SHOTMODE=true

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          WANT="${{ github.event.inputs.device || 'iPhone 16 Pro Max' }}"
          xcrun simctl list devices available
          # take the first available device whose name matches
          UDID=$(xcrun simctl list devices available | grep -F "$WANT (" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$UDID" ]; then
            # fall back to any Pro Max, then any iPhone
            UDID=$(xcrun simctl list devices available | grep -E "iPhone .*Pro Max \(" | tail -1 | grep -oE '[0-9A-F-]{36}' || true)
          fi
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone " | tail -1 | grep -oE '[0-9A-F-]{36}')
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # clean status bar: 9:41, full battery and signal
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$UDID" appearance light

      - name: Install the app
        run: |
          set -euo pipefail
          xcrun simctl install "${{ steps.sim.outputs.udid }}" build/ios/iphonesimulator/Runner.app

      - name: Take screenshots
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="com.coreinteractive.prayerLock"
          mkdir -p screenshots

          # The app watches this file and switches to the screen written in it.
          xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true
          echo home > /tmp/prayerlock_shot.txt
          xcrun simctl launch "$UDID" "$APP"
          sleep 12

          shoot () {
            NAME="$1"
            echo "$NAME" > /tmp/prayerlock_shot.txt
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/$NAME.png"
            echo "saved $NAME"
          }

          # numbered so they sort in a good order
          shoot lockintro
          shoot onboarding_0
          shoot onboarding_1
          shoot onboarding_2
          shoot onboarding_3
          shoot onboarding_4
          shoot onboarding_9
          shoot onboarding_12
          shoot reminder
          shoot commit
          shoot commit_hold
          shoot compare
          shoot insights_a
          shoot insights_b
          shoot insights_c
          shoot paywall
          shoot home
          shoot prayer
          shoot loader
          shoot mood
          shoot mood_low
          shoot mood_high
          shoot feeling
          shoot schedule
          shoot done
          shoot auth
          shoot privacy
          shoot support
          shoot ioslocked
          shoot joy
          shoot streak
          shoot badges
          shoot locked
          shoot insights
          shoot profile
          shoot plan
          shoot admin

          ls -la screenshots

      - name: Record the animations (video)
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="com.coreinteractive.prayerLock"
          mkdir -p screenshots
          show () { echo "$1" > /tmp/prayerlock_shot.txt; sleep "$2"; }
          # start the film, then walk through the screens that move
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force screenshots/animations.mov &
          REC=$!
          sleep 3
          show onboarding_0 4
          show onboarding_2 4
          show compare 5
          show loader 8
          show prayer 5
          show joy 7
          show streak 7
          show home 4
          show insights_a 5
          show insights_b 5
          show insights_c 5
          show reminder 4
          kill -INT $REC || true
          wait $REC || true
          ls -la screenshots/animations.mov

      - name: Save app log (helps when a picture looks wrong)
        if: always()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 5m --predicate 'process == "Runner"' --style compact > screenshots/app-log.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/
          retention-days: 2
          if-no-files-found: warn
